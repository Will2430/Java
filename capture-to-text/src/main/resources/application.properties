spring.application.name=capture-to-text

server.port=8080

# Local MongoDB, default port, database "capturetotext" (created automatically on first write)
spring.data.mongodb.uri=mongodb://localhost:27017/capturetotext

# Screenshots/photos can be a few MB; keep limits generous but bounded for an MVP
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.capturetotext=INFO

# Kafka -- publishes "OCR this capture" jobs; the worker module (../worker)
# consumes them. Plain String key/value: the message is just a capture id,
# the DB stays the single source of truth for everything else.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.capture-uploads-topic=capture-uploads

# MinIO -- stores uploaded image bytes so the worker (a separate process)
# can retrieve them by object key. Matches docker-compose.yml's minio service.
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=captures

# Observability -- /actuator/prometheus is what Prometheus scrapes;
# /actuator/health/{liveness,readiness} are the k8s probe targets. Only
# these two are exposed on purpose (no /actuator/env, /heapdump, etc).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Emit histogram buckets so Grafana can compute p95/p99 with histogram_quantile
# (without this Micrometer only exports count/sum/max, which can't give a percentile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
