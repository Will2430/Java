spring.application.name=capture-to-text

server.port=8080

# Local MongoDB, default port, database "capturetotext" (created automatically on first write)
spring.data.mongodb.uri=mongodb://localhost:27017/capturetotext

# Screenshots/photos can be a few MB; keep limits generous but bounded for an MVP
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.capturetotext=INFO

# Kafka -- publishes "OCR this capture" jobs; the worker module (../worker)
# consumes them. Plain String key/value: the message is just a capture id,
# the DB stays the single source of truth for everything else.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.capture-uploads-topic=capture-uploads

# MinIO -- stores uploaded image bytes so the worker (a separate process)
# can retrieve them by object key. Matches docker-compose.yml's minio service.
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=captures

# Observability -- /actuator/prometheus is what Prometheus scrapes;
# /actuator/health/{liveness,readiness} are the k8s probe targets. Only
# these two are exposed on purpose (no /actuator/env, /heapdump, etc).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
# Emit histogram buckets so Grafana can compute p95/p99 with histogram_quantile
# (without this Micrometer only exports count/sum/max, which can't give a percentile).
management.metrics.distribution.percentiles-histogram.http.server.requests=true


# Payments -- Stripe test-mode keys come from config/secrets.properties locally
# (gitignored) or STRIPE_* env vars in k8s. The imported file wins over these defaults.
spring.config.import=optional:file:./config/secrets.properties
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Where Stripe's hosted page sends the user back after paying or cancelling.
app.public-base-url=http://localhost:8080
app.kafka.payment-events-topic=payment-events
app.outbox.poll-interval-ms=1000
# Off by default in Spring Boot: without it, @Indexed(unique = true) creates no
# index and the idempotency key isn't actually enforced.
spring.data.mongodb.auto-index-creation=true

# Auth -- Keycloak (docker-compose) issues JWT access tokens; the API only validates them.
# Keys are fetched from the JWK set URL on the first request, so the API still starts while
# Keycloak is down. Tokens must have been issued by this realm ("iss") and for this API ("aud").
# In k8s the JWK URL points at host.minikube.internal; the issuer stays localhost:8180
# because that's the address the browser logged in at (see KC_HOSTNAME in docker-compose).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/capture-to-text
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/capture-to-text/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=capture-to-text-api

# Rate limiting -- token buckets in Redis, one per user per group (see RateLimitInterceptor).
# capacity = the burst allowed; refill-per-minute = the sustained rate.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=500ms
app.rate-limit.payments.capacity=10
app.rate-limit.payments.refill-per-minute=10
app.rate-limit.api.capacity=120
app.rate-limit.api.refill-per-minute=120
# The limiter fails open when Redis is down, so Redis must not fail the health check either.
management.health.redis.enabled=false
