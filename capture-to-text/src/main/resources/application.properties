spring.application.name=capture-to-text

server.port=8080

# Local MongoDB, default port, database "capturetotext" (created automatically on first write)
spring.data.mongodb.uri=mongodb://localhost:27017/capturetotext

# Screenshots/photos can be a few MB; keep limits generous but bounded for an MVP
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.capturetotext=INFO
