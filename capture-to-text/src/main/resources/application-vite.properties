# Profile "vite": use while developing the React client with `npm run dev` (frontend/).
# Stripe's success/cancel redirects go back to the Vite dev server instead of the jar's
# built copy on 8080. Deliberately config, not derived from the request's Origin/Host
# header: whoever sends the request controls that header (open redirect).
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=vite"
app.public-base-url=http://localhost:5173
