<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture to Text</title>
<style>
  :root {
    color-scheme: light dark;
    --border: #888;
    --accent: #3b6ef5;
  }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.4rem; }
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .drop-zone.dragover {
    background-color: rgba(59, 110, 245, 0.1);
    border-color: var(--accent);
  }
  .drop-zone input { display: none; }
  #preview {
    max-width: 100%;
    max-height: 220px;
    margin-top: 1rem;
    display: none;
    border-radius: 6px;
  }
  textarea {
    width: 100%;
    min-height: 200px;
    margin-top: 1rem;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.95rem;
    padding: 0.5rem;
    box-sizing: border-box;
  }
  .row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
  button {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: transparent; color: inherit; }
  #status { font-size: 0.9rem; opacity: 0.8; }
  #status.error { color: #d33; opacity: 1; }
  ul#history { list-style: none; padding: 0; margin-top: 0.5rem; }
  ul#history li {
    padding: 0.6rem 0.5rem;
    border-bottom: 1px solid rgba(128,128,128,0.3);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }
  ul#history li:hover { background: rgba(59, 110, 245, 0.08); }
  .snippet { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 0.8rem; opacity: 0.7; white-space: nowrap; }
  section { margin-top: 2rem; }
</style>
</head>
<body>

<h1>Capture to Text</h1>
<p>Drop an image, pick a file, or paste (Ctrl/Cmd+V) a screenshot from your clipboard.</p>

<div class="drop-zone" id="dropZone">
  <p>Drag & drop an image here, or click to choose a file</p>
  <input type="file" id="fileInput" accept="image/*">
</div>
<img id="preview" alt="preview">

<div id="status"></div>

<textarea id="output" placeholder="Extracted text will appear here..." readonly></textarea>
<div class="row">
  <button id="copyBtn" disabled>Copy to clipboard</button>
  <span id="copyConfirm"></span>
</div>

<section>
  <h2>History</h2>
  <ul id="history"></ul>
</section>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const output = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');
const copyConfirm = document.getElementById('copyConfirm');
const statusEl = document.getElementById('status');
const historyList = document.getElementById('history');

function setStatus(message, isError) {
  statusEl.textContent = message || '';
  statusEl.className = isError ? 'error' : '';
}

function showPreview(file) {
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
}

// POST /api/captures now returns 202 immediately (status: PENDING) --
// OCR runs later, out-of-process, in the worker module. The client has to
// come back and ask GET /api/captures/{id} how it went.
const POLL_INTERVAL_MS = 1500;

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function pollUntilDone(id) {
  for (;;) {
    await sleep(POLL_INTERVAL_MS);
    const res = await fetch(`/api/captures/${id}`);
    const capture = await res.json();
    if (!res.ok) {
      throw new Error(capture.message || `Request failed with status ${res.status}`);
    }
    if (capture.status !== 'PENDING') {
      return capture;
    }
  }
}

async function uploadImage(file) {
  if (!file.type.startsWith('image/')) {
    setStatus('Please provide an image file.', true);
    return;
  }
  showPreview(file);
  setStatus('Uploading...');
  copyBtn.disabled = true;
  output.value = '';

  const formData = new FormData();
  formData.append('image', file, file.name || 'pasted-image.png');

  try {
    const res = await fetch('/api/captures', { method: 'POST', body: formData });
    const pending = await res.json();
    if (!res.ok) {
      throw new Error(pending.message || `Request failed with status ${res.status}`);
    }
    setStatus('Processing (OCR running in the background)...');
    loadHistory();

    const capture = await pollUntilDone(pending.id);
    if (capture.status === 'FAILED') {
      throw new Error(capture.errorMessage || 'OCR failed.');
    }

    output.value = capture.extractedText || '';
    copyBtn.disabled = !capture.extractedText;
    const confidence = capture.ocrConfidence != null ? ` (confidence: ${capture.ocrConfidence.toFixed(1)}%)` : '';
    setStatus(`Done${confidence}`);
    loadHistory();
  } catch (err) {
    setStatus(err.message, true);
  }
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadImage(fileInput.files[0]);
});

['dragover', 'dragenter'].forEach(evt =>
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  })
);
['dragleave', 'drop'].forEach(evt =>
  dropZone.addEventListener(evt, e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
  })
);
dropZone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) uploadImage(file);
});

document.addEventListener('paste', e => {
  const items = e.clipboardData ? e.clipboardData.items : [];
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      uploadImage(item.getAsFile());
      break;
    }
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(output.value);
    copyConfirm.textContent = 'Copied!';
    setTimeout(() => (copyConfirm.textContent = ''), 1500);
  } catch (err) {
    copyConfirm.textContent = 'Copy failed';
  }
});

async function loadHistory() {
  try {
    const res = await fetch('/api/captures?size=20&sort=createdAt,desc');
    const page = await res.json();
    historyList.innerHTML = '';
    for (const capture of page.content || []) {
      const li = document.createElement('li');
      const snippet = document.createElement('span');
      snippet.className = 'snippet';
      snippet.textContent = capture.status === 'PENDING'
        ? '(processing...)'
        : (capture.extractedText || '').replace(/\s+/g, ' ').trim() || '(no text found)';
      const meta = document.createElement('span');
      meta.className = 'meta';
      const statusSuffix = capture.status !== 'DONE' ? ` · ${capture.status}` : '';
      meta.textContent = new Date(capture.createdAt).toLocaleString() + statusSuffix;
      li.appendChild(snippet);
      li.appendChild(meta);
      li.addEventListener('click', () => {
        output.value = capture.extractedText || '';
        copyBtn.disabled = !capture.extractedText;
        setStatus(`Loaded capture from ${meta.textContent}`);
      });
      historyList.appendChild(li);
    }
  } catch (err) {
    console.error('Failed to load history', err);
  }
}

loadHistory();
</script>
</body>
</html>
