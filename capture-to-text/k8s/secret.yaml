# Credential-shaped values live in a Secret, not the ConfigMap, even though
# these particular values are just the docker-compose dev defaults
# (minioadmin/minioadmin) -- the point is the separation of concerns itself:
# in a real deployment only this file's contents would change (e.g. to a
# value pulled from a vault/external-secrets operator), not the Deployment
# or ConfigMap.
#
# stringData is plaintext here for readability; kubectl base64-encodes it
# into .data on `apply`. `kubectl get secret ... -o yaml` will show it
# base64-encoded, NOT encrypted -- base64 is an encoding, not security. Do
# not commit real credentials this way in an actual project.
apiVersion: v1
kind: Secret
metadata:
  name: capture-api-secrets
type: Opaque
stringData:
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
