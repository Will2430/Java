# imagePullPolicy: Never is deliberate -- this image only exists in
# minikube's local image cache (loaded via `minikube image load`), it was
# never pushed to a registry. The default pull policy (IfNotPresent for a
# tagged image, Always for :latest) would make kubelet try to pull
# "capture-to-text-api:local" from Docker Hub and fail with ImagePullBackOff,
# since no such repo exists there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture-api
  labels:
    app: capture-api
spec:
  # Three replicas so kube-proxy has something to balance across; the API is
  # stateless (all state lives in Mongo/MinIO/Kafka), which is what makes
  # this safe. If an HPA is ever attached, delete this line -- otherwise every
  # `kubectl apply` resets whatever count the autoscaler chose.
  replicas: 3
  selector:
    matchLabels:
      app: capture-api
  template:
    metadata:
      labels:
        app: capture-api
      # Prometheus discovers scrape targets from these pod annotations (see
      # monitoring/prometheus.yaml) -- no per-service scrape config to maintain.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: capture-api
          image: capture-to-text-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: capture-api-config
            - secretRef:
                name: capture-api-secrets
          # readinessProbe gates whether the Service routes traffic to this
          # pod at all; livenessProbe gates whether kubelet kills and
          # restarts it. Actuator exposes them as separate endpoints so the
          # two questions can diverge (e.g. Spring flips readiness to
          # OUT_OF_SERVICE while draining on shutdown, without failing
          # liveness and triggering a pointless restart).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
