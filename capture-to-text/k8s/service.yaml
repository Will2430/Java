# NodePort (rather than the default ClusterIP) so the service is reachable
# from the Windows host for manual testing via `minikube service capture-api`,
# without needing a separate `kubectl port-forward` process running.
apiVersion: v1
kind: Service
metadata:
  name: capture-api
spec:
  type: NodePort
  selector:
    app: capture-api
  ports:
    - port: 8080
      targetPort: 8080
