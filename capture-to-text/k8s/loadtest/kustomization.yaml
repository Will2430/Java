# Bundles the script + sample image into the ConfigMap the Job mounts at
# /scripts. Kustomize only reads files inside its own directory, which is why
# the script and PNG live here rather than in a top-level loadtest/ folder.

# Kustomize is initially a standalone config management tool, now incorporated into native kubectl, apply -k tell k8s to look for a kustomization
# .yaml in the direc, which within u can specified the base file, and the fields you want to patch/overide, then it would swap it out and with 
# kubectl -k {directory}, it will look for the base file in kustom..yaml and read the overlay and delpoys the base file with the overlays
resources:
  - k6-job.yaml

configMapGenerator:
  - name: k6-loadtest-scripts
    files:
      - k6-script.js
      - loadtest.png
generatorOptions:
  disableNameSuffixHash: true
