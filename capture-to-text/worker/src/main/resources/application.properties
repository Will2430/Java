spring.application.name=capture-to-text-worker

# Same database the API module writes to -- this process only ever
# updates existing "captures" documents, never creates them.
spring.data.mongodb.uri=mongodb://localhost:27017/capturetotext

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ocr-workers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.capture-uploads-topic=capture-uploads

# Matches docker-compose.yml's minio service / the API module's bucket.
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=captures

logging.level.com.capturetotext=INFO
