spring.application.name=capture-to-text-worker

# Same database the API module writes to -- this process only ever
# updates existing "captures" documents, never creates them.
spring.data.mongodb.uri=mongodb://localhost:27017/capturetotext

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ocr-workers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.capture-uploads-topic=capture-uploads

# Matches docker-compose.yml's minio service / the API module's bucket.
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=captures

logging.level.com.capturetotext=INFO

# Ops-only HTTP surface (health + metrics). 8081, not 8080, so the worker
# can run next to the API on one machine without a port clash.
server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Consumer threads per worker process. Partition count (3) is the ceiling on
# parallelism across the whole consumer group, so with N pods each thread
# count must be low enough for pods to share partitions: 3 pods x 1 thread
# = 3 busy partitions; 1 pod x 3 threads leaves any 2nd pod idle.
app.kafka.listener-concurrency=3
